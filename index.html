<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Odyssey - Reimagine Social</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#0f172a',
                        primary: '#6366f1',
                        surface: '#1e293b',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    animation: {
                        'fade-in-up': 'fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'float': 'float 6s ease-in-out infinite',
                        'pulse-glow': 'pulseGlow 3s ease-in-out infinite',
                        'spin-slow': 'spin 12s linear infinite',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(40px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-15px)' },
                        },
                        pulseGlow: {
                            '0%, 100%': { boxShadow: '0 0 20px rgba(99, 102, 241, 0.2)' },
                            '50%': { boxShadow: '0 0 40px rgba(99, 102, 241, 0.6)' },
                        }
                    }
                }
            }
        }
    </script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
 
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- tsParticles -->
    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>
    <!-- Vanilla Tilt for 3D Cards -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>
    <!-- React Force Graph -->
    <script src="https://unpkg.com/react-force-graph-2d"></script>
</head>
<body class="bg-background text-slate-200 font-sans antialiased overflow-x-hidden selection:bg-primary/30">
    <!-- Particle Background Container -->
    <div id="tsparticles" class="fixed inset-0 z-0 pointer-events-none opacity-50"></div>
    
    <div id="root" class="relative z-10"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Icons using SVG
        const Icon = ({ name, className = "w-6 h-6" }) => {
            return <i data-lucide={name} className={className}></i>;
        };

        const TOPICS = ['Ideas', 'Design', 'Technology', 'Culture', 'Philosophy'];

        const EXPLORE_CARDS = [
            { id: 1, title: 'The Future of Digital Connection', participants: 124, color: 'from-blue-500 to-indigo-500', image: 'https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&q=80&w=800' },
            { id: 2, title: 'Minimalist Tech Lifestyles', participants: 89, color: 'from-emerald-500 to-teal-500', image: 'https://images.unsplash.com/photo-1494438639946-1ebd1d20bf85?auto=format&fit=crop&q=80&w=800' },
            { id: 3, title: 'Generative Art Collaborations', participants: 256, color: 'from-purple-500 to-pink-500', image: 'https://images.unsplash.com/photo-1549490349-8643362247b5?auto=format&fit=crop&q=80&w=800' },
        ];

        const DISCUSSIONS = [
            { id: 1, topic: 'Philosophy', author: 'Elena R.', question: 'If algorithms curate our feeds, do we still have free will in what we consume?', tags: ['ethics', 'ai', 'deep-dive'], responses: 42 },
            { id: 2, topic: 'Design', author: 'Marcus T.', question: 'How can we design interfaces that encourage users to log off rather than stay endlessly?', tags: ['ux', 'wellbeing'], responses: 18 },
            { id: 3, topic: 'Culture', author: 'Sophia K.', question: 'The rise of "slow social": Async voice notes vs instant messaging.', tags: ['communication', 'trends'], responses: 35 },
        ];

        const SidebarItem = ({ icon, label, active = false, onClick, delay }) => (
            <button 
                onClick={onClick}
                style={{ animationDelay: delay }}
                className={`opacity-0 animate-fade-in-up flex flex-col items-center justify-center p-3 w-full rounded-2xl transition-all duration-300 ${active ? 'text-primary bg-indigo-900/30 shadow-sm scale-105' : 'text-slate-400 hover:bg-slate-800/50 hover:text-primary hover:scale-105'}`}>
                <Icon name={icon} className="w-6 h-6 mb-1.5" />
                <span className="text-[10px] font-bold uppercase tracking-widest">{label}</span>
            </button>
        );

        const Sidebar = ({ activeView, setActiveView }) => (
            <div className="w-24 h-screen bg-surface/40 backdrop-blur-xl border-r border-slate-700/50 flex flex-col items-center py-8 gap-6 fixed left-0 top-0 z-20 shadow-[4px_0_24px_rgba(0,0,0,0.2)]">
                <div className="w-14 h-14 bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 rounded-2xl flex items-center justify-center mb-6 shadow-xl shadow-indigo-500/20 transform hover:scale-110 hover:rotate-3 transition-all cursor-pointer animate-float">
                    <span className="text-white font-black text-xl tracking-tighter mix-blend-overlay">Ody</span>
                </div>
                
                <nav className="flex-1 w-full px-3 flex flex-col gap-3">
                    <SidebarItem icon="home" label="Home" active={activeView === 'home'} onClick={() => setActiveView('home')} delay="100ms" />
                    <SidebarItem icon="compass" label="Discover" active={activeView === 'discover'} onClick={() => setActiveView('discover')} delay="150ms" />
                    <SidebarItem icon="plus-square" label="Create" active={activeView === 'create'} onClick={() => setActiveView('create')} delay="200ms" />
                    <SidebarItem icon="users" label="Spaces" active={activeView === 'spaces'} onClick={() => setActiveView('spaces')} delay="250ms" />
                </nav>

                <div className="w-full px-3 mt-auto flex flex-col gap-3">
                    <SidebarItem icon="user" label="Profile" active={activeView === 'profile'} onClick={() => setActiveView('profile')} delay="300ms" />
                </div>
            </div>
        );

        const ExploreCard = ({ card, onClick, index }) => {
            const tiltRef = useRef(null);
            useEffect(() => {
                if (tiltRef.current) {
                    VanillaTilt.init(tiltRef.current, {
                        max: 15,
                        speed: 400,
                        glare: true,
                        "max-glare": 0.3,
                        scale: 1.05
                    });
                }
            }, []);

            return (
                <div 
                    ref={tiltRef}
                    onClick={onClick} 
                    style={{ animationDelay: `${300 + index * 150}ms` }}
                    className={`opacity-0 animate-fade-in-up rounded-[2rem] bg-gradient-to-br ${card.color} p-[2px] h-80 cursor-pointer group shadow-2xl`}>
                    <div className="bg-surface/90 backdrop-blur-xl w-full h-full rounded-[30px] overflow-hidden flex flex-col relative z-10">
                        <div className="h-44 overflow-hidden relative">
                            <div className="absolute inset-0 bg-gradient-to-t from-surface to-transparent z-10"></div>
                            <img src={card.image} alt={card.title} className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" />
                        </div>
                        <div className="p-6 flex-1 flex flex-col justify-between relative z-20 -mt-4">
                            <h3 className="font-bold text-slate-100 text-xl leading-snug group-hover:text-primary transition-colors">{card.title}</h3>
                            <div className="flex items-center justify-between mt-4">
                                <div className="flex -space-x-3">
                                    {[...Array(3)].map((_, i) => (
                                        <div key={i} className="w-8 h-8 rounded-full border-2 border-surface bg-slate-700 flex items-center justify-center overflow-hidden shadow-sm transition-transform group-hover:-translate-y-1" style={{ transitionDelay: `${i * 50}ms` }}>
                                            <img src={`https://i.pravatar.cc/100?img=${card.id * 10 + i}`} alt="avatar" />
                                        </div>
                                    ))}
                                </div>
                                <span className="text-xs font-bold text-indigo-300 bg-indigo-900/50 px-3 py-1 rounded-full border border-indigo-500/20">+{card.participants} joined</span>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const DiscussionCard = ({ discussion, onClick, index }) => {
            const tiltRef = useRef(null);
            useEffect(() => {
                if (tiltRef.current) {
                    VanillaTilt.init(tiltRef.current, {
                        max: 10,
                        speed: 300,
                        glare: true,
                        "max-glare": 0.1,
                    });
                }
            }, []);

            return (
                <div 
                    ref={tiltRef}
                    onClick={onClick} 
                    style={{ animationDelay: `${500 + index * 100}ms` }}
                    className="opacity-0 animate-fade-in-up bg-surface/60 backdrop-blur-md rounded-[1.5rem] p-6 shadow-xl border border-slate-700/50 hover:border-indigo-500/50 transition-colors cursor-pointer group">
                    <div className="flex items-center justify-between mb-4">
                        <span className="text-xs font-black text-transparent bg-clip-text bg-gradient-to-r from-primary to-purple-400 uppercase tracking-widest">{discussion.topic}</span>
                        <span className="text-sm font-medium text-slate-400 flex items-center gap-2">
                            <img src={`https://i.pravatar.cc/100?img=${discussion.id + 50}`} className="w-5 h-5 rounded-full border border-slate-600" />
                            {discussion.author}
                        </span>
                    </div>
                    <h3 className="text-xl font-bold text-slate-100 mb-6 group-hover:text-primary transition-colors leading-relaxed">{discussion.question}</h3>
                    <div className="flex items-center justify-between">
                        <div className="flex gap-2">
                            {discussion.tags.map(tag => (
                                <span key={tag} className="px-3 py-1.5 bg-slate-800/50 text-slate-300 rounded-lg text-xs font-semibold border border-slate-700 transition-colors group-hover:bg-indigo-900/30 group-hover:text-indigo-300 group-hover:border-indigo-500/30">
                                    #{tag}
                                </span>
                            ))}
                        </div>
                        <div className="flex items-center gap-5 text-slate-400">
                            <button className="flex items-center gap-1.5 hover:text-pink-500 transition-colors group/btn">
                                <Icon name="heart" className="w-5 h-5 group-hover/btn:fill-pink-500 transition-colors" />
                            </button>
                            <button className="flex items-center gap-1.5 hover:text-primary transition-colors">
                                <Icon name="message-circle" className="w-5 h-5" />
                                <span className="text-sm font-bold">{discussion.responses}</span>
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const Modal = ({ isOpen, onClose, title, children }) => {
            if (!isOpen) return null;
            return (
                <div 
                    className="fixed inset-0 z-50 flex items-center justify-center bg-background/80 backdrop-blur-sm p-4 cursor-pointer"
                    onClick={onClose}
                >
                    <div 
                        className="bg-surface rounded-3xl w-full max-w-lg shadow-[0_0_50px_rgba(99,102,241,0.15)] border border-slate-700 overflow-hidden transform transition-all animate-fade-in-up cursor-default"
                        onClick={(e) => e.stopPropagation()}
                    >
                        <div className="flex justify-between items-center p-6 border-b border-slate-700">
                            <h3 className="text-xl font-bold text-slate-100">{title}</h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-white transition-colors p-2 rounded-full hover:bg-slate-700">
                                <Icon name="x" className="w-5 h-5" />
                            </button>
                        </div>
                        <div className="p-6">
                            {children}
                        </div>
                    </div>
                </div>
            );
        };

        function App() {
            const [activeTopic, setActiveTopic] = useState('Ideas');
            const [activeView, setActiveView] = useState('home');
            const [selectedCard, setSelectedCard] = useState(null);
            const [selectedDiscussion, setSelectedDiscussion] = useState(null);

            useEffect(() => {
                lucide.createIcons();
                
                // Initialize particles
                if (window.tsParticles) {
                    window.tsParticles.load("tsparticles", {
                        background: { color: { value: "transparent" } },
                        fpsLimit: 60,
                        interactivity: {
                            events: {
                                onHover: { enable: true, mode: "grab" },
                                resize: true,
                            },
                            modes: { grab: { distance: 140, links: { opacity: 0.5 } } },
                        },
                        particles: {
                            color: { value: "#6366f1" },
                            links: { color: "#6366f1", distance: 150, enable: true, opacity: 0.2, width: 1 },
                            move: { enable: true, speed: 1, direction: "none", random: false, straight: false, outModes: { default: "bounce" } },
                            number: { density: { enable: true, area: 800 }, value: 60 },
                            opacity: { value: 0.3 },
                            shape: { type: "circle" },
                            size: { value: { min: 1, max: 3 } },
                        },
                        detectRetina: true,
                    });
                }
            }, []);

            // Initialize network graph data topology
            const [graphData] = useState(() => {
                const nodes = [
                    // Core Topics
                    { id: 'T1', group: 'topic', label: 'Philosophy & Life', val: 40, color: '#6366f1' },
                    { id: 'T2', group: 'topic', label: 'Future of Tech', val: 35, color: '#ec4899' },
                    { id: 'T3', group: 'topic', label: 'Mindful Living', val: 30, color: '#10b981' },
                    { id: 'T4', group: 'topic', label: 'Creative Arts', val: 30, color: '#f59e0b' },
                    
                    // Discussions (Spaces)
                    { id: 'D1', group: 'discussion', label: 'What is a "good life"?', val: 18, color: '#a5b4fc', parent: 'T1', desc: 'A deep dive into modern existentialism.' },
                    { id: 'D2', group: 'discussion', label: 'Stoicism today', val: 15, color: '#a5b4fc', parent: 'T1', desc: 'Applying ancient wisdom to modern chaos.' },
                    { id: 'D3', group: 'discussion', label: 'AI as a connection tool', val: 20, color: '#fbcfe8', parent: 'T2', desc: 'How do we ensure AI remains a tool for connection, not isolation?' },
                    { id: 'D4', group: 'discussion', label: 'Post-scarcity society', val: 15, color: '#fbcfe8', parent: 'T2', desc: 'Economic models for the next century.' },
                    { id: 'D5', group: 'discussion', label: 'Digital Detox', val: 18, color: '#6ee7b7', parent: 'T3', desc: 'Strategies for unplugging in a hyper-connected world.' },
                    { id: 'D6', group: 'discussion', label: 'Generative Design', val: 16, color: '#fcd34d', parent: 'T4', desc: 'Collaborating with algorithms to create art.' },
                    
                    // Users (People currently in these spaces)
                    ...['Elena', 'Marcus', 'Sophia', 'Jian', 'Aisha', 'David', 'Zoe', 'Liam', 'Maya', 'Omar', 'Chloe', 'Noah', 'Ava', 'Ethan'].map((name, i) => ({
                        id: `U${i}`, 
                        group: 'user', 
                        label: name, 
                        val: 8, 
                        color: '#94a3b8',
                        initials: name.substring(0,2).toUpperCase()
                    }))
                ];

                const links = [
                    { source: 'T1', target: 'T2' }, { source: 'T2', target: 'T3' }, { source: 'T3', target: 'T4' }, { source: 'T4', target: 'T1' },
                    { source: 'D1', target: 'T1' }, { source: 'D2', target: 'T1' },
                    { source: 'D3', target: 'T2' }, { source: 'D4', target: 'T2' },
                    { source: 'D5', target: 'T3' },
                    { source: 'D6', target: 'T4' },
                ];

                // Connect users intentionally to discussions to form distinct clusters
                const userDiscussions = ['D1', 'D3', 'D5', 'D2', 'D6', 'D4', 'D1', 'D3', 'D5', 'D2', 'D6', 'D1', 'D4', 'D2'];
                userDiscussions.forEach((target, i) => {
                    links.push({ source: `U${i}`, target });
                    // Create some peer-to-peer connections
                    if (i > 0 && i % 3 === 0) {
                        links.push({ source: `U${i}`, target: `U${i-1}` });
                    }
                });

                return { nodes, links };
            });

            // Main Map View Component
            const HomeView = () => {
                const fgRef = useRef();

                useEffect(() => {
                    if (fgRef.current) {
                        fgRef.current.d3Force('charge').strength(-400);
                        fgRef.current.d3Force('link').distance(60);
                    }
                }, []);

                const handleNodeClick = (node) => {
                    if (node.group === 'discussion') {
                        setSelectedDiscussion({
                            topic: graphData.nodes.find(n => n.id === node.parent)?.label || 'General',
                            question: node.label,
                            author: 'Community',
                            tags: [node.group, 'trending'],
                            responses: Math.floor(Math.random() * 30) + 5
                        });
                    } else if (node.group === 'topic') {
                        setSelectedCard({
                            title: node.label,
                            image: `https://images.unsplash.com/photo-${node.id === 'T1' ? '1464822759023-fed622ff2c3b' : node.id === 'T2' ? '1518002171953-a080ee817e1f' : '1534447677768-be436bb09401'}?auto=format&fit=crop&q=80&w=800`,
                            participants: Math.floor(Math.random() * 100) + 20,
                            color: 'from-indigo-900 to-purple-900'
                        });
                    }
                    
                    if (fgRef.current) {
                        fgRef.current.centerAt(node.x, node.y, 1000);
                        fgRef.current.zoom(2, 2000);
                    }
                };

                return (
                    <div className="absolute inset-0 w-full h-full animate-fade-in-up">
                        <div className="absolute top-10 left-32 z-10 pointer-events-none">
                            <h1 className="text-5xl font-bold text-white mb-2 tracking-tight">The <span className="text-transparent bg-clip-text bg-gradient-to-r from-indigo-500 to-purple-500 animate-pulse-glow inline-block">Constellation</span></h1>
                            <p className="text-slate-400 text-lg max-w-md">Break free from the feed. Explore ideas, join clusters of thought, and connect organically through shared curiosity.</p>
                        </div>
                        <div className="absolute bottom-10 left-32 z-10 bg-surface/80 backdrop-blur-md p-4 rounded-2xl border border-slate-700/50 shadow-xl flex gap-6">
                            <div className="flex items-center gap-2"><div className="w-3 h-3 rounded-full bg-[#6366f1]"></div><span className="text-sm text-slate-300">Topics</span></div>
                            <div className="flex items-center gap-2"><div className="w-3 h-3 rounded-full bg-[#a5b4fc]"></div><span className="text-sm text-slate-300">Discussions</span></div>
                            <div className="flex items-center gap-2"><div className="w-3 h-3 rounded-full bg-[#94a3b8]"></div><span className="text-sm text-slate-300">People</span></div>
                        </div>
                        <div className="absolute top-10 right-10 z-10 w-80 pointer-events-none">
                            <h3 className="text-slate-400 text-xs font-bold uppercase tracking-widest mb-4 flex items-center gap-2">
                                <span className="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span> Live Network Activity
                            </h3>
                            <div className="flex flex-col gap-3">
                                {[
                                    { user: 'Elena', action: 'sparked a new thought in', target: 'Philosophy & Life', time: 'Just now' },
                                    { user: 'Marcus', action: 'gravitated towards', target: 'Digital Detox', time: '2m ago' },
                                    { user: 'Sophia', action: 'connected with', target: 'Jian', time: '5m ago' },
                                ].map((activity, i) => (
                                    <div key={i} className="bg-surface/40 backdrop-blur-md rounded-xl p-3 text-sm border border-slate-700/50 shadow-lg animate-fade-in-up" style={{ animationDelay: `${i * 200 + 500}ms` }}>
                                        <div className="text-slate-200">
                                            <strong className="text-white">{activity.user}</strong> {activity.action} <strong className="text-indigo-400">{activity.target}</strong>
                                        </div>
                                        <div className="text-slate-500 text-xs mt-1">{activity.time}</div>
                                    </div>
                                ))}
                            </div>
                        </div>
                        <ForceGraph2D
                            ref={fgRef}
                            graphData={graphData}
                            nodeLabel="label"
                            nodeVal="val"
                            linkColor={() => 'rgba(99, 102, 241, 0.2)'}
                            linkWidth={1.5}
                            backgroundColor="transparent"
                            onNodeClick={handleNodeClick}
                            nodeCanvasObject={(node, ctx, globalScale) => {
                                const radius = Math.sqrt(node.val) * 2;

                                if (node.group === 'topic') {
                                    ctx.beginPath();
                                    ctx.arc(node.x, node.y, radius + 4, 0, 2 * Math.PI, false);
                                    ctx.strokeStyle = `rgba(99, 102, 241, 0.3)`;
                                    ctx.lineWidth = 2 / globalScale;
                                    ctx.stroke();
                                }

                                ctx.beginPath();
                                ctx.arc(node.x, node.y, radius, 0, 2 * Math.PI, false);
                                ctx.fillStyle = node.color;
                                
                                ctx.shadowColor = node.color;
                                ctx.shadowBlur = node.group === 'user' ? 5 : 15;
                                ctx.fill();
                                ctx.shadowBlur = 0; 
                                
                                ctx.textAlign = 'center';
                                ctx.textBaseline = 'middle';
                                
                                if (node.group === 'user') {
                                    ctx.fillStyle = '#0f172a'; 
                                    ctx.font = `bold ${radius * 0.8}px Sans-Serif`;
                                    ctx.fillText(node.initials, node.x, node.y + (radius * 0.1));
                                } else {
                                    ctx.fillStyle = '#ffffff';
                                    const fontSize = node.group === 'topic' ? 14/globalScale : 10/globalScale;
                                    ctx.font = `bold ${fontSize}px Sans-Serif`;
                                    ctx.fillText(node.label, node.x, node.y + radius + (8/globalScale));
                                }
                            }}
                            nodePointerAreaPaint={(node, color, ctx) => {
                                ctx.fillStyle = color;
                                ctx.beginPath();
                                ctx.arc(node.x, node.y, Math.sqrt(node.val) * 2 + 5, 0, 2 * Math.PI, false);
                                ctx.fill();
                            }}
                        />
                    </div>
                );
            };

            const DiscoverView = () => (
                <div className="animate-fade-in-up">
                    <header className="mb-12 relative">
                        <div className="absolute top-0 right-0 -mr-20 -mt-10 opacity-10 pointer-events-none">
                            <svg width="404" height="404" fill="none" viewBox="0 0 404 404"><defs><pattern id="pattern-grid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="4" height="4" fill="currentColor"></rect></pattern></defs><rect width="404" height="404" fill="url(#pattern-grid)" class="text-primary"></rect></svg>
                        </div>
                        
                        <h1 className="text-5xl font-bold text-white mb-6 tracking-tight relative z-10">Explore new <span className="text-transparent bg-clip-text bg-gradient-to-r from-indigo-500 to-purple-500 animate-pulse-glow inline-block">perspectives</span></h1>
                        
                        <div className="flex items-center gap-8 mb-8 relative z-10">
                            {TOPICS.map(topic => (
                                <button 
                                    key={topic}
                                    onClick={() => setActiveTopic(topic)}
                                    className={`text-sm font-bold pb-2 border-b-2 transition-all ${
                                        activeTopic === topic 
                                            ? 'border-primary text-primary shadow-[0_4px_10px_-4px_rgba(99,102,241,0.5)]' 
                                            : 'border-transparent text-slate-400 hover:text-slate-200'
                                    }`}
                                >
                                    {topic}
                                </button>
                            ))}
                        </div>

                        <div className="relative max-w-2xl group z-10">
                            <div className="absolute inset-y-0 left-4 flex items-center pointer-events-none">
                                <Icon name="search" className="h-5 w-5 text-slate-500 group-focus-within:text-primary transition-colors" />
                            </div>
                            <input 
                                type="text" 
                                placeholder="What are you curious about?" 
                                className="w-full pl-12 pr-4 py-4 bg-surface/50 backdrop-blur-sm rounded-2xl shadow-lg border border-slate-700/50 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary text-slate-200 placeholder-slate-500 transition-all text-lg"
                            />
                        </div>
                    </header>

                    <section className="mb-16 relative z-10">
                        <div className="flex items-center justify-between mb-6 animate-fade-in-up" style={{ animationDelay: '200ms' }}>
                            <h2 className="text-2xl font-bold text-white">Curated Spaces</h2>
                            <button className="text-sm font-bold text-primary hover:text-indigo-400 transition-colors flex items-center gap-1 group">
                                View all <Icon name="arrow-right" className="w-4 h-4 transform group-hover:translate-x-1 transition-transform" />
                            </button>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                            {EXPLORE_CARDS.map((card, idx) => (
                                <ExploreCard key={card.id} card={card} index={idx} onClick={() => setSelectedCard(card)} />
                            ))}
                        </div>
                    </section>

                    <section className="relative z-10">
                        <div className="flex items-center justify-between mb-6 animate-fade-in-up" style={{ animationDelay: '400ms' }}>
                            <h2 className="text-2xl font-bold text-white">Active Discussions</h2>
                            <button className="text-sm font-bold text-primary hover:text-indigo-400 transition-colors flex items-center gap-1 group">
                                More discussions <Icon name="arrow-right" className="w-4 h-4 transform group-hover:translate-x-1 transition-transform" />
                            </button>
                        </div>
                        <div className="grid gap-5 max-w-3xl">
                            {DISCUSSIONS.map((discussion, idx) => (
                                <DiscussionCard key={discussion.id} discussion={discussion} index={idx} onClick={() => setSelectedDiscussion(discussion)} />
                            ))}
                        </div>
                    </section>
                </div>
            );

            const CreateView = () => (
                <div className="flex flex-col items-center justify-center h-[70vh] text-center animate-fade-in-up relative z-10">
                    <div className="w-24 h-24 bg-surface/50 backdrop-blur-sm rounded-full flex items-center justify-center mb-6 shadow-[0_0_30px_rgba(99,102,241,0.2)] border border-slate-700">
                        <Icon name="pen-tool" className="w-12 h-12 text-primary" />
                    </div>
                    <h2 className="text-4xl font-bold text-white mb-4">Start a Conversation</h2>
                    <p className="text-slate-400 max-w-md text-lg mb-8">Share your perspective with the network and see who gravitates toward your ideas.</p>
                    <button className="bg-primary hover:bg-indigo-500 text-white font-bold py-3 px-8 rounded-xl transition-all shadow-[0_0_20px_rgba(99,102,241,0.4)] hover:-translate-y-1">
                        New Node
                    </button>
                </div>
            );

            const SpacesView = () => (
                <div className="flex flex-col items-center justify-center h-[70vh] text-center animate-fade-in-up relative z-10">
                    <div className="w-24 h-24 bg-surface/50 backdrop-blur-sm rounded-full flex items-center justify-center mb-6 shadow-[0_0_30px_rgba(99,102,241,0.2)] border border-slate-700">
                        <Icon name="box" className="w-12 h-12 text-primary" />
                    </div>
                    <h2 className="text-4xl font-bold text-white mb-4">Your Constellations</h2>
                    <p className="text-slate-400 max-w-md text-lg">Explore the dedicated clusters and private spaces you belong to.</p>
                </div>
            );

            const ProfileView = () => (
                <div className="flex flex-col items-center justify-center h-[70vh] text-center animate-fade-in-up relative z-10">
                    <div className="w-24 h-24 bg-surface/50 backdrop-blur-sm rounded-full flex items-center justify-center mb-6 shadow-[0_0_30px_rgba(99,102,241,0.2)] border border-slate-700">
                        <img src="https://i.pravatar.cc/150?img=68" className="w-full h-full rounded-full border-2 border-primary object-cover" />
                    </div>
                    <h2 className="text-4xl font-bold text-white mb-2">My Orbit</h2>
                    <p className="text-slate-400 max-w-md text-lg mb-4">You have sparked 3 conversations and connected with 12 thinkers this week.</p>
                </div>
            );

            return (
                <div className="min-h-screen flex relative overflow-hidden">
                    <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-primary/5 rounded-full blur-[100px] pointer-events-none"></div>

                    <Sidebar activeView={activeView} setActiveView={setActiveView} />
                    
                    <main className={`flex-1 ml-24 ${activeView === 'home' ? '' : 'p-10 pt-16 max-w-7xl mx-auto min-h-screen'}`}>
                        {activeView === 'home' && <HomeView />}
                        {activeView === 'discover' && <DiscoverView />}
                        {activeView === 'create' && <CreateView />}
                        {activeView === 'spaces' && <SpacesView />}
                        {activeView === 'profile' && <ProfileView />}
                    </main>

                    <Modal 
                        isOpen={!!selectedCard} 
                        onClose={() => setSelectedCard(null)} 
                        title={selectedCard?.title}
                    >
                        {selectedCard && (
                            <div className="flex flex-col gap-4">
                                <img src={selectedCard.image} className="w-full h-56 object-cover rounded-2xl shadow-inner" alt="Cover" />
                                <p className="text-slate-300 leading-relaxed text-lg">Join <strong className="text-white">{selectedCard.participants} others</strong> in exploring this curated space. Engage in deep, meaningful conversations away from the noise of traditional social media feeds.</p>
                                <button className="mt-4 w-full bg-gradient-to-r from-primary to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold py-4 px-6 rounded-xl transition-all shadow-[0_0_20px_rgba(99,102,241,0.4)] hover:shadow-[0_0_30px_rgba(99,102,241,0.5)] hover:-translate-y-1">
                                    Join Space
                                </button>
                            </div>
                        )}
                    </Modal>

                    <Modal 
                        isOpen={!!selectedDiscussion} 
                        onClose={() => setSelectedDiscussion(null)} 
                        title={selectedDiscussion?.topic}
                    >
                        {selectedDiscussion && (
                            <div className="flex flex-col gap-4">
                                <h4 className="text-2xl font-bold text-white leading-snug">{selectedDiscussion.question}</h4>
                                <p className="text-sm text-slate-400 flex items-center gap-2">
                                    <img src={`https://i.pravatar.cc/100?img=${selectedDiscussion.id + 50}`} className="w-6 h-6 rounded-full border border-slate-600" />
                                    Started by <strong className="text-slate-200">{selectedDiscussion.author}</strong>
                                </p>
                                <div className="p-5 bg-surface/50 rounded-xl border border-slate-700/50 mt-4 relative overflow-hidden">
                                    <div className="absolute top-0 left-0 w-1 h-full bg-primary"></div>
                                    <p className="text-slate-300 italic text-lg leading-relaxed">"I've been thinking about this a lot lately, and I wanted to get everyone's perspective..."</p>
                                </div>
                                <div className="mt-6 flex gap-3">
                                    <input type="text" placeholder="Add your perspective..." className="flex-1 px-5 py-3 bg-surface/50 border border-slate-700 rounded-xl focus:outline-none focus:border-primary text-white placeholder-slate-500 transition-colors shadow-inner" />
                                    <button className="bg-primary text-white font-bold px-6 py-3 rounded-xl hover:bg-indigo-500 transition-colors shadow-lg shadow-indigo-500/20">Reply</button>
                                </div>
                            </div>
                        )}
                    </Modal>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
